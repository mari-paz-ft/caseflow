version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: caseflow-postgres
    environment:
      POSTGRES_DB: case_db
      POSTGRES_USER: caseflow
      POSTGRES_PASSWORD: caseflow_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: caseflow-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/case_db
      SPRING_DATASOURCE_USERNAME: caseflow
      SPRING_DATASOURCE_PASSWORD: caseflow_secret
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: caseflow-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
