server:
  port: 8082

spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${AUTH_DB_USERNAME:caseflow}
    password: ${AUTH_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none

caseflow:
  jwt:
    secret: ${CASEFLOW_JWT_SECRET}
    ttl-seconds: ${CASEFLOW_JWT_TTL_SECONDS:3600}
